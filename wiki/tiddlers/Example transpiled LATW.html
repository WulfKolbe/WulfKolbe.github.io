<script>
// Module loader - defines base LATW class and initial module exports
(function(window) {
  'use strict';
  
  class LATW {
  bibkey;
  data;
  tags;
  flags;
  constructor(bibkey, tags = "", flags = {}) {
    this.bibkey = bibkey;
    this.data = new Map;
    this.tags = Array.isArray(tags) ? tags.join(" ") : tags;
    this.flags = flags;
  }
  add(id, content, extraFields = {}) {
    const key = this.generateTiddlerKey(id);
    this.data.set(key, { ...extraFields, content });
  }
  generateTiddlerKey(id) {
    return id;
  }
  processFullText(text) {
    return text;
  }
  processParagraph(paragraph) {
    return paragraph;
  }
  addTiddler(tiddlers, key, text, extraFields = {}) {
    const tagsString = this.tags.split(" ").map((tag) => tag.includes(" ") ? `[${tag}]` : tag).join(" ");
    tiddlers.set(key, {
      title: key,
      text,
      tags: `${tagsString} bibkey:${this.bibkey}`,
      type: "text/vnd.tiddlywiki",
      ...extraFields
    });
  }
  appendTiddlers(tiddlers) {
    for (const [key, value] of this.data) {
      const { content, ...extraFields } = value;
      this.addTiddler(tiddlers, key, content, extraFields);
    }
  }
  init(tiddlers) {
    tiddlers.forEach((tiddler) => {
      this.data.set(tiddler.title, tiddler);
    });
  }
}

  if (typeof window !== 'undefined') {
    window.LATW = LATW;
  }
})(typeof window !== 'undefined' ? window : globalThis);

  constructor(bibkey, tags = "", flags = {}) {
    super(bibkey, tags, flags);
  }
  processFullText(content) {
    if (this.flags.debug) {
      console.error(`[DEBUG] DocumentHeaderModule: Processing document header`);
    }
    const documentclass = content.match(/\\documentclass(?:\[[^\]]*\])\s*{([^}]+)}/);
    const title = content.match(/\\title\s*{([^}]+)}/);
    const author = content.match(/\\author\s*{([^}]+)}/);
    const date = content.match(/\\date\s*{([^}]+)}/);
    const docKey = `${this.bibkey}_document`;
    const docTitle = title ? title[1] : "Untitled Document";
    const metadata = {
      type: "text/vnd.tiddlywiki",
      kind: "document",
      title: docTitle,
      author: author ? author[1] : "Unknown",
      date: date ? date[1] : new Date().getFullYear().toString(),
      documentclass: documentclass ? documentclass[1] : "",
      bibkey: this.bibkey
    };
    this.add(docKey, `Document: ${docTitle}`, metadata);
    const projectPath = this.flags.projectPath || "";
    const contentWithPath = `%%%PROJECT_PATH=${projectPath}
${content}`;
    if (this.flags.debug) {
      console.error(`[DEBUG] DocumentHeaderModule: Created document metadata`);
    }
    return contentWithPath;
  }
  processParagraph(paragraph) {
    return paragraph;
  }
}

  
  if (typeof window !== 'undefined') {
    window.DocumentHeaderModule = DocumentHeaderModule;

(function(window) {
  'use strict';
  
  const LATW = window.LATW || {};

class ParagraphScanner extends LATW {
  constructor(bibkey, tags = "", flags = {}) {
    super(bibkey, tags, flags);
  }
  processFullText(text) {
    if (this.flags.debug) {
      console.error(`[DEBUG] ParagraphScanner: Processing ${text.length} characters`);
    }
    let processedText = text;
    let paragraphCount = 0;
    const paragraphs = processedText.split(/\n\s*\n/);
    paragraphs.forEach((paragraph, index) => {
      if (paragraph.trim() && !paragraph.trim().startsWith("\\")) {
        paragraphCount++;
        const tiddlerKey = `${this.bibkey}_paragraph_${String(paragraphCount).padStart(3, "0")}`;
        this.add(tiddlerKey, paragraph.trim(), {
          type: "text/vnd.tiddlywiki",
          kind: "paragraph",
          refnum: paragraphCount.toString(),
          anchor: tiddlerKey
        });
      }
    });
    if (this.flags.debug) {
      console.error(`[DEBUG] ParagraphScanner: Found ${paragraphCount} paragraphs`);
    }
    return processedText;
  }
  processParagraph(paragraph) {
    return paragraph;
  }
}

  
  if (typeof window !== 'undefined') {
    window.ParagraphScanner = ParagraphScanner;
  }

<script>
// Main LATW processing function
(function(window) {
  'use strict';
  
  async function processLaTeX(content, options = {}) {
    const {
      bibkey = "LaTeXProject",
      config = [],
      debug = false,
      projectPath = ""
    } = options;
    
    const flags = { debug, projectPath };
    const modules = [];
    
    // Load modules from window
    config.forEach((moduleConfig) => {
      try {
        const ModuleClass = window[moduleConfig.classname];
        if (ModuleClass && typeof ModuleClass === "function") {
          const instance = new ModuleClass(bibkey, moduleConfig.tags || "", flags);
          modules.push(instance);
          if (debug) {
            console.error(`[DEBUG] Loaded module: ${moduleConfig.classname}`);
          }
        }
      } catch (error) {
        console.error(`Error loading module ${moduleConfig.classname}:`, error);
      }
    });
    
    const tiddlers = new Map();
    let processedText = content;
    
    // Initialize modules
    modules.forEach(module => {
      if (module.init) {
        module.init(Array.from(tiddlers.values()));
      }
    });
    
    // Process through each module
    for (const processor of modules) {
      if (debug) {
        console.error(`[DEBUG] Processing with: ${processor.constructor.name}`);
      }
      
      try {
        if (processor.processFullText) {
          const result = processor.processFullText(processedText);
          if (typeof result === "string") {
            processedText = result;
          }
        }
      } catch (error) {
        console.error(`Error in ${processor.constructor.name}:`, error);
      }
    }
    
    // Paragraph processing
    const paragraphs = processedText.split('\\n\\n');
    if (debug) {
      console.error(`[DEBUG] Split into ${paragraphs.length} paragraphs`);
    }
    
    const processedParagraphs = paragraphs.map((paragraph, index) => {
      let processedParagraph = paragraph;
      
      for (const processor of modules) {
        try {
          if (processor.processParagraph) {
            const result = processor.processParagraph(processedParagraph);
            if (typeof result === "string") {
              processedParagraph = result;
            }
          }
        } catch (error) {
          console.error(`Error in ${processor.constructor.name} processParagraph:`, error);
        }
      }
      
      return processedParagraph;
    });
    
    const finalText = processedParagraphs.join('\\n\\n');
    
    // Append tiddlers from each processor
    for (const processor of modules) {
      try {
        if (processor.appendTiddlers) {
          processor.appendTiddlers(tiddlers);
        }
      } catch (error) {
        console.error(`Error appending tiddlers from ${processor.constructor.name}:`, error);
      }
    }
    
    return {
      processedText: finalText,
      tiddlers: Array.from(tiddlers.values()),
      modules: modules.map((m) => m.constructor.name)
    };
  }
  
  // Expose to window
  if (typeof window !== 'undefined') {
    window.processLaTeX = processLaTeX;
  }
})(typeof window !== 'undefined' ? window : globalThis);

// UI Functions
let currentResult = null;

async function uiProcessLaTeX() {
    const latex = document.getElementById('latexInput').value;
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    
    status.textContent = 'Processing LaTeX...';
    status.className = 'status';
    output.textContent = '';
    downloadBtn.style.display = 'none';
    
    try {
        if (!window.processLaTeX) {
            throw new Error('LATW not properly loaded');
        }
        
        const result = await window.processLaTeX(latex, {
            bibkey: 'latw-' + Date.now(),
            config: [
                { classname: 'LATW', tags: '' },
                        { classname: 'SectionScanner', tags: '' },
                        { classname: 'FormulaScanner', tags: '' },
                        { classname: 'BibliographyModule', tags: '' },
                        { classname: 'TableScanner', tags: '' },
                        { classname: 'ReferenceScanner', tags: '' },
                        { classname: 'MacroScanner', tags: '' },
                        { classname: 'GraphicsScanner', tags: '' },
                        { classname: 'TikzScanner', tags: '' },
                        { classname: 'LATW', tags: '' },
                        { classname: 'DocumentHeaderModule', tags: '' },
                        { classname: 'ParagraphScanner', tags: '' }
            ],
            debug: true
        });
        
        currentResult = result;
        status.textContent = '✅ Created ' + result.tiddlers.length + ' tiddlers';
        status.className = 'status success';
        output.textContent = JSON.stringify(result.tiddlers, null, 2);
        downloadBtn.style.display = 'inline-block';
        
        console.log('Processing complete:', result);
        
    } catch (error) {
        status.textContent = '❌ Error: ' + error.message;
        status.className = 'status error';
        output.textContent = error.stack || error.toString();
        console.error('Processing failed:', error);
    }
}

function downloadJSON() {
    if (!currentResult) return;
    
    const dataStr = JSON.stringify(currentResult.tiddlers, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tiddlers_' + Date.now() + '.json';
    a.click();
    URL.revokeObjectURL(url);
}

// Check if LATW is loaded
window.addEventListener('load', () => {
    const status = document.getElementById('status');
    if (window.LATW && window.processLaTeX) {
        status.textContent = '✅ LATW loaded successfully! Ready to convert.';
        status.className = 'status success';
    } else {
        status.textContent = '❌ LATW failed to load. Check console for errors.';
        status.className = 'status error';
    }
});



</script>
